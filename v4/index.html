<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>版本四 - 十鍵掉落字母遊戲</title>
  <style>
    body {
      font-family: system-ui, "Microsoft JhengHei", sans-serif;
      background-color: #212529;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .header {
      margin-top: 20px;
      text-align: center;
      z-index: 10;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      height: 70vh;
      border: 2px solid #495057;
      border-radius: 8px;
      background: #111;
      overflow: hidden;
      margin-top: 10px;
    }
    .falling-letter {
      position: absolute;
      font-size: 2rem;
      font-weight: bold;
      color: #0dcaf0;
      background: #333;
      padding: 8px 16px;
      border-radius: 50%;
    }
    .back-btn {
      color: #adb5bd;
      text-decoration: none;
      margin-top: 15px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>版本四：十鍵掉落字母遊戲</h2>
    <div>得分：<span id="score">0</span></div>
    <a href="../index.html" class="back-btn">← 返回歷程首頁</a>
  </div>

  <div id="game-container"></div>

  <script>
    const container = document.getElementById('game-container');
    const scoreEl = document.getElementById('score');
    const keys = ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', ';'];
    let score = 0;
    let activeLetters = [];

    function spawnLetter() {
      const char = keys[Math.floor(Math.random() * keys.length)];
      const el = document.createElement('div');
      el.className = 'falling-letter';
      el.innerText = char;
      
      const posX = Math.random() * (container.clientWidth - 60);
      el.style.left = posX + 'px';
      el.style.top = '0px';

      container.appendChild(el);

      const letterObj = {
        char: char,
        el: el,
        top: 0
      };
      activeLetters.push(letterObj);
    }

    function update() {
      for (let i = activeLetters.length - 1; i >= 0; i--) {
        let item = activeLetters[i];
        item.top += 2;
        item.el.style.top = item.top + 'px';

        if (item.top > container.clientHeight - 40) {
          container.removeChild(item.el);
          activeLetters.splice(i, 1);
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      const pressedKey = e.key.toUpperCase();
      for (let i = 0; i < activeLetters.length; i++) {
        if (activeLetters[i].char === pressedKey) {
          container.removeChild(activeLetters[i].el);
          activeLetters.splice(i, 1);
          score += 10;
          scoreEl.innerText = score;
          break;
        }
      }
    });

    setInterval(spawnLetter, 1500);
    setInterval(update, 30);
  </script>
</body>
</html>
