<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英打遊戲開發歷程</title>
  <style>
    body {
      font-family: system-ui, "Microsoft JhengHei", sans-serif;
      background-color: #f4f6f8;
      color: #212529;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      box-sizing: border-box;
    }
    h1 { margin-bottom: 8px; }
    .subtitle { color: #6c757d; margin-bottom: 32px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      max-width: 900px;
      width: 100%;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      border: 1px solid #e9ecef;
      box-shadow: 0 4px 6px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card h3 { margin-top: 0; }
    .btn {
      display: block;
      text-align: center;
      padding: 10px;
      background-color: #0d6efd;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      margin-top: 16px;
    }
    .btn:hover { background-color: #0b5ed7; }
  </style>
</head>
<body>
  <h1>英打遊戲開發歷程</h1>
  <p class="subtitle">記錄從基礎介面到完整遊戲的開發過程</p>

  <div class="grid">
    <div class="card">
      <div>
        <h3>版本一</h3>
        <p>基本 HTML/CSS 介面搭建。</p>
      </div>
      <a class="btn" href="https://u11517023-source.github.io/typing-v1/" target="_blank">前往版本一</a>
    </div>

    <div class="card">
      <div>
        <h3>版本二</h3>
        <p>加入圖片與音效互動體驗。</p>
      </div>
      <a class="btn" href="https://u11517023-source.github.io/typing-v2/" target="_blank">前往版本二</a>
    </div>

    <div class="card">
      <div>
        <h3>版本三</h3>
        <p>ASDF 主導鍵練習遊戲。</p>
      </div>
      <a class="btn" href="./v3/index.html">前往版本三</a>
    </div>

    <div class="card">
      <div>
        <h3>版本四</h3>
        <p>十鍵掉落字母遊戲。</p>
      </div>
      <a class="btn" href="./v4/index.html">前往版本四</a>
    </div>
  </div>
</body>
</html>
